; Afficheur de supervision : WeAct Studio Black Pill STM32F401 + écran ST7789 1.9" (170x320).
; Le PC (FreeBSD) envoie les mesures en texte sur le port série USB (CDC ACM).

[env:blackpill_f401cc]
platform = ststm32
board = blackpill_f401cc     ; marche aussi sur la F401CE (plus de flash/RAM, inutilisées ici)
framework = arduino
upload_protocol = dfu        ; BOOT0 appuyé + reset, puis : pio run -t upload
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.0
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.0
build_flags =
    -I include               ; wiring_private.h vide, attendu par la bibliothèque ST77xx
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -D USBD_VID=0x0483
    -D USBD_PID=0x5740
    -D USB_MANUFACTURER_STRING="\"WeAct\""
    -D USB_PRODUCT_STRING="\"SysMon F401\""
